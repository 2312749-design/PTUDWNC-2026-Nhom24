<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập | Culinary Blog</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f2f6ff, #eefaf5);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1b2a41;
    }
    .login-box {
      width: min(460px, 90vw);
      background: white;
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 12px 30px rgba(14, 30, 37, 0.12);
    }
    h2 { text-align: center; margin: 0 0 20px; }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dfe8f1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #4d8df7; box-shadow: 0 0 0 3px rgba(77,141,247,0.12); }
    .primary-btn, .secondary-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      margin-top: 8px;
    }
    .primary-btn {
      background: linear-gradient(135deg, #2f80ed, #36c3a2);
      color: white;
    }
    .secondary-btn {
      background: #f2f5f9;
      color: #2a3b52;
      margin-top: 10px;
    }
    .helper-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 16px 0 8px;
      font-size: 14px;
    }
    .helper-row a {
      text-decoration: none;
      color: #1d6fe8;
      font-weight: 600;
    }
    .google-login {
      margin-top: 12px;
      background: #fff;
      border: 1px solid #dfe8f1;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      font-weight: 700;
      color: #d93025;
      cursor: pointer;
    }
    .token-box {
      margin-top: 18px;
      background: #f7f9ff;
      border: 1px solid #dfe8f1;
      border-radius: 10px;
      padding: 16px;
    }
    .token-box h3 { margin: 0 0 12px; font-size: 16px; }
    .message {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .message.error { background: #fff2f0; color: #b42318; display: block; }
    .message.success { background: #ecfdf3; color: #027a48; display: block; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Đăng nhập</h2>
    <div class="form-group">
      <label for="usernameOrEmail">Tài khoản</label>
      <input id="usernameOrEmail" type="text" placeholder="Nhập tài khoản hoặc email" />
    </div>
    <div class="form-group">
      <label for="password">Mật khẩu</label>
      <input id="password" type="password" placeholder="Nhập mật khẩu" />
    </div>

    <button class="primary-btn" id="loginBtn">Đăng nhập</button>

    <div class="helper-row">
      <a href="/register">Đăng ký</a>
      <a href="#" id="googleLink">Đăng nhập bằng Google</a>
    </div>

    <button class="google-login" id="googleLoginBtn">🔐 Đăng nhập bằng Google</button>

    <div class="token-box">
      <h3>Đăng nhập bằng Token</h3>
      <input id="tokenInput" type="text" placeholder="Nhập token của bạn" />
      <button class="secondary-btn" id="tokenLoginBtn">Vào trang chủ</button>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script>
    const API = 'http://localhost:5152/api';

    function showMessage(type, text) {
      const msg = document.getElementById('message');
      msg.className = `message ${type}`;
      msg.textContent = text;
    }

    async function loginWithAccount() {
      const usernameOrEmail = document.getElementById('usernameOrEmail').value.trim();
      const password = document.getElementById('password').value;

      if (!usernameOrEmail || !password) {
        showMessage('error', 'Vui lòng nhập tài khoản và mật khẩu.');
        return;
      }

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: usernameOrEmail,
            username: usernameOrEmail,
            password
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || 'Đăng nhập thất bại');
        }

        localStorage.setItem('accessToken', data.accessToken || '');
        localStorage.setItem('refreshToken', data.refreshToken || '');
        showMessage('success', 'Đăng nhập thành công! Đang chuyển hướng...');
        setTimeout(() => window.location.href = '/home', 600);
      } catch (error) {
        showMessage('error', error.message || 'Lỗi đăng nhập.');
      }
    }

    async function loginWithGoogle() {
      try {
        const googleToken = prompt('Nhập Google ID Token để đăng nhập:', '');
        if (!googleToken) return;

        const res = await fetch(`${API}/auth/google-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken: googleToken })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || 'Google login failed');
        }

        localStorage.setItem('accessToken', data.accessToken || '');
        localStorage.setItem('refreshToken', data.refreshToken || '');
        showMessage('success', 'Đăng nhập Google thành công!');
        setTimeout(() => window.location.href = '/home', 600);
      } catch (error) {
        showMessage('error', error.message || 'Lỗi đăng nhập bằng Google.');
      }
    }

    function loginWithToken() {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) {
        showMessage('error', 'Vui lòng nhập token để tiếp tục.');
        return;
      }

      localStorage.setItem('accessToken', token);
      showMessage('success', 'Token đã được lưu. Đang chuyển tới trang chủ...');
      setTimeout(() => window.location.href = '/home', 600);
    }

    document.getElementById('loginBtn').addEventListener('click', loginWithAccount);
    document.getElementById('googleLoginBtn').addEventListener('click', loginWithGoogle);
    document.getElementById('tokenLoginBtn').addEventListener('click', loginWithToken);
    document.getElementById('googleLink').addEventListener('click', (e) => {
      e.preventDefault();
      loginWithGoogle();
    });
  </script>
</body>
</html>
