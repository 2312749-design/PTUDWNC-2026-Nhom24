worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    upstream frontend_upstream { server frontend:3000; }
    upstream api_upstream { server api:8080; }

    server {
        listen 80;
        server_name ${PUBLIC_HOST};
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl http2;
        server_name ${PUBLIC_HOST};
        ssl_certificate /etc/letsencrypt/live/${PUBLIC_HOST}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${PUBLIC_HOST}/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        client_max_body_size 50M;

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location ~ ^/(health|uploads|swagger|hangfire) {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

