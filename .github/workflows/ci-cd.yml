name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - 'nguyeducthanhlab*'
      - 'codex/**'
  pull_request:
    branches:
      - main
      - master
      - 'nguyeducthanhlab*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore CulinaryBlog.slnx

      - name: Build backend
        run: dotnet build CulinaryBlog.slnx --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test tests/CulinaryBlog.API.Tests/CulinaryBlog.API.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend contracts and structured data
        working-directory: frontend
        run: npm test

      - name: Install browser for UI tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: frontend
        run: npx playwright test

      - name: Validate Docker Compose file
        env:
          # These values only validate Compose interpolation in CI.
          POSTGRES_PASSWORD: ci-compose-postgres-placeholder
          MINIO_ROOT_USER: ci-compose-minio
          MINIO_ROOT_PASSWORD: ci-compose-minio-placeholder
          JWT_SECRET: ci-compose-validation-placeholder-not-a-deployment-secret
        run: docker compose config --quiet

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            tests/**/TestResults/**
            frontend/test-results/**
            frontend/playwright-report/**

  docker:
    name: Publish Docker images
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CulinaryBlog.API/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/culinaryblog-api:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/culinaryblog-frontend:${{ github.sha }}
