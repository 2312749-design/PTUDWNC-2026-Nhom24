services:
  db:
    image: postgres:16-alpine
    container_name: culinaryblog-db
    environment:
      POSTGRES_DB: CulinaryBlogDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CulinaryBlogDb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: culinaryblog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  minio-init:
    image: busybox:1.36
    container_name: culinaryblog-minio-init
    user: "0:0"
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - minio-data:/data
    restart: "no"

  minio:
    image: cleanstart/minio:latest
    container_name: culinaryblog-minio
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    container_name: culinaryblog-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    expose:
      - "4317"
      - "4318"
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    environment:
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger-data:/badger
    ports:
      - "127.0.0.1:16686:16686"

  jaeger-init:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /badger"]
    volumes:
      - jaeger-data:/badger
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-culinary-local-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"

  api:
    build:
      context: .
      dockerfile: src/CulinaryBlog.API/Dockerfile
    container_name: culinaryblog-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=CulinaryBlogDb;Username=postgres;Password=postgres;SSL Mode=Disable;
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Minio__Enabled: "true"
      Minio__Endpoint: http://minio:9000
      Minio__AccessKey: minioadmin
      Minio__SecretKey: minioadmin
      Minio__Bucket: culinary-blog
      Minio__PublicBaseUrl: http://localhost:9000
      JwtSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET in your environment or .env file before starting Docker Compose.}
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    expose:
      - "8080"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost
        NEXT_PUBLIC_API_URL: http://localhost/api
    container_name: culinaryblog-frontend
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost
      NEXT_PUBLIC_API_URL: http://localhost/api
      API_INTERNAL_URL: http://api:8080/api/v1
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: culinaryblog-nginx
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  jaeger-data:
  prometheus-data:
  grafana-data:
